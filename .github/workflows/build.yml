              // ---------- local intent (works even if the AI forgets the tag) ----------

              private static String detectMaterial(String lower) {
                  String[] w = lower.replaceAll("[^a-z0-9_ ]", " ").trim().split("\\s+");
                  for (int i = 0; i < w.length; i++) {
                      List<String> c = new ArrayList<>();
                      if (i + 1 < w.length) c.add(w[i] + "_" + w[i + 1]);
                      c.add(w[i]);
                      c.add(w[i] + "_planks");
                      for (String s : c) {
                          if (s.length() >= 3 && Builds.pickBlock(s, null) != null) return s;
                      }
                  }
                  return null;
              }

              private static boolean localIntent(ServerPlayerEntity player, String text) {
                  String lower = text.toLowerCase().trim();
                  String nm = CONFIG.name.toLowerCase();
                  lower = lower.replaceFirst("^" + Pattern.quote(nm) + "[ ,:]*", "").trim();

                  ServerWorld world = player.getServerWorld();
                  AiBotEntity bot = findNearestBot(world, player);

                  boolean stopWord = lower.matches("^(stop|wait|stay|stay here|stop it|tigil)[ .!]*$");
                  boolean comeWord = lower.matches("^(come|come here|follow me|follow|come to me|lapit)[ .!]*$");

                  Matcher fm = FIND_WORDS.matcher(lower);
                  String findTarget = null;
                  if (fm.find()) {
                      String tg = fm.group(1).trim();
                      String[] cuts = {" please", " pls", " for me", " now", " here", " near", " around", " in ", " at ", " and ", " for "};
                      for (String c : cuts) {
                          int idx = tg.indexOf(c);
                          if (idx > 0) tg = tg.substring(0, idx);
                      }
                      tg = tg.trim();
                      if (tg.length() >= 3) findTarget = tg;
                  }

                  String shape = null;
                  if (lower.matches(".*\\b(build|make|create|construct|gawa|gumawa)\\b.*")) {
                      if (lower.contains("house") || lower.contains("home") || lower.contains("hut") || lower.contains("cabin") || lower.contains("bahay")) shape = "house";
                      else if (lower.contains("tower")) shape = "tower";
                      else if (lower.contains("wall") || lower.contains("fence")) shape = "wall";
                      else if (lower.contains("bridge")) shape = "bridge";
                      else if (lower.contains("platform") || lower.contains("floor")) shape = "platform";
                      else if (lower.contains("pyramid")) shape = "pyramid";
                  }

                  if (!stopWord && !comeWord && findTarget == null && shape == null) return false;

                  if (bot == null) {
                      player.sendMessage(Text.literal("<" + CONFIG.name + "> Spawn me first with /ai spawn"), false);
                      return true;
                  }

                  if (stopWord) {
                      bot.stopJob("Okay, I stopped.", player);
                      return true;
                  }
                  if (comeWord) {
                      bot.stopJob("I'm coming!", player);
                      return true;
                  }
                  if (shape != null) {
                      String material = detectMaterial(lower);
                      Matcher nmch = Pattern.compile("(\\d{1,3})").matcher(lower);
                      String size = nmch.find() ? nmch.group(1) : null;
                      bot.startBuild(player, shape, material, size);
                      return true;
                  }

                  bot.startFind(player, findTarget);
                  return true;
              }

              // ---------- AI chat ----------

              public static void askAi(ServerPlayerEntity player, String userMessage, boolean showPlayerBubble) {
                  if (showPlayerBubble) {
                      player.sendMessage(Text.literal("<" + player.getName().getString() + "> " + userMessage), false);
                  }

                  boolean acted = localIntent(player, userMessage);

                  if (!CONFIG.hasKey()) {
                      if (!acted) player.sendMessage(Text.literal("<" + CONFIG.name + "> Set my key first: /ai key YOUR_KEY"), false);
                      return;
                  }

                  MinecraftServer server = player.getServer();
                  if (server == null) return;

                  player.sendMessage(Text.literal("<" + CONFIG.name + "> thinking..."), true);

                  CompletableFuture.runAsync(() -> {
                      try {
                          String reply = callApi(player, userMessage);

                          server.execute(() -> {
                              String shown = handleActions(player, reply, acted);
                              if (shown == null || shown.isBlank()) return;
                              for (String part : splitReply(shown)) {
                                  player.sendMessage(Text.literal("<" + CONFIG.name + "> " + part), false);
                              }
                          });
                      } catch (Exception e) {
                          String msg = e.getMessage();
                          if (msg == null) msg = e.getClass().getSimpleName();
                          String finalMsg = msg;
                          server.execute(() -> player.sendMessage(Text.literal("<" + CONFIG.name + "> Error: " + finalMsg), false));
                      }
                  });
              }

              private static String callApi(ServerPlayerEntity player, String userMessage) throws Exception {
                  List<JsonObject> history = HISTORY.computeIfAbsent(player.getUuid(), k -> new ArrayList<>());

                  JsonObject system = new JsonObject();
                  system.addProperty("role", "system");
                  system.addProperty("content",
                          CONFIG.personality +
                                  "\n\nYour name is " + CONFIG.name + "." +
                                  "\nYou are speaking to " + player.getName().getString() + "." +
                                  "\nPlayer position: X=" + (int) player.getX() + ", Y=" + (int) player.getY() + ", Z=" + (int) player.getZ() + "." +
                                  "\nDimension: " + player.getWorld().getRegistryKey().getValue() + "." +
                                  "\nPlayer health: " + (int) player.getHealth() + "/" + (int) player.getMaxHealth() + "." +
                                  "\nYou have your own body in the Minecraft world and the game really performs your actions. Never say you cannot." +
                                  "\nWhen the player asks you to BUILD, add exactly one tag at the very end: [BUILD shape material size]" +
                                  "\nAllowed shapes: house, tower, wall, bridge, platform, pyramid." +
                                  "\nExamples: [BUILD house oak_planks 9], [BUILD tower stone_bricks 7], [BUILD bridge spruce_planks 18]." +
                                  "\nIf no size is given, leave the size out." +
                                  "\nWhen the player asks to FIND something, add exactly one tag at the very end: [FIND thing]" +
                                  "\nExamples: [FIND diamond], [FIND iron], [FIND coal], [FIND tree], [FIND apple]." +
                                  "\nIf the player says come or follow, add [COME]. If the player says stop or wait, add [STOP]." +
                                  "\nAdd only ONE tag when an action is needed, otherwise no tag." +
                                  "\nKeep replies short and friendly, under 3 sentences."
                  );

                  JsonObject user = new JsonObject();
                  user.addProperty("role", "user");
                  user.addProperty("content", userMessage);

                  history.add(user);
                  while (history.size() > 12) {
                      history.remove(0);
                  }

                  JsonArray messages = new JsonArray();
                  messages.add(system);
                  for (JsonObject old : new ArrayList<>(history)) {
                      messages.add(old);
                  }

                  JsonObject body = new JsonObject();
                  body.addProperty("model", CONFIG.model);
                  body.addProperty("temperature", 0.75);
                  body.add("messages", messages);

                  HttpRequest request = HttpRequest.newBuilder()
                          .uri(URI.create(CONFIG.apiUrl))
                          .timeout(Duration.ofSeconds(60))
                          .header("Content-Type", "application/json")
                          .header("Authorization", "Bearer " + CONFIG.apiKey)
                          .POST(HttpRequest.BodyPublishers.ofString(body.toString()))
                          .build();

                  HttpResponse<String> response = HTTP.send(request, HttpResponse.BodyHandlers.ofString());

                  if (response.statusCode() < 200 || response.statusCode() >= 300) {
                      throw new RuntimeException("API " + response.statusCode() + ": " + response.body());
                  }

                  JsonObject json = JsonParser.parseString(response.body()).getAsJsonObject();
                  JsonElement content = json
                          .getAsJsonArray("choices")
                          .get(0).getAsJsonObject()
                          .getAsJsonObject("message")
                          .get("content");

                  String reply = (content == null || content.isJsonNull()) ? "" : content.getAsString().trim();

                  JsonObject assistant = new JsonObject();
                  assistant.addProperty("role", "assistant");
                  assistant.addProperty("content", reply);
                  history.add(assistant);
                  while (history.size() > 12) {
                      history.remove(0);
                  }

                  return reply;
              }

              private static String handleActions(ServerPlayerEntity player, String reply, boolean alreadyActed) {
                  if (reply == null) return "";

                  boolean done = alreadyActed;
                  AiBotEntity bot = findNearestBot(player.getServerWorld(), player);

                  Matcher b = BUILD_TAG.matcher(reply);
                  if (b.find()) {
                      String shape = b.group(1).trim();
                      String material = b.group(2) == null || b.group(2).isBlank() ? null : b.group(2).trim();
                      String size = b.group(3) == null || b.group(3).isBlank() ? null : b.group(3).trim();
                      if (!done) {
                          done = true;
                          if (bot == null) player.sendMessage(Text.literal("<" + CONFIG.name + "> Spawn me first with /ai spawn"), false);
                          else bot.startBuild(player, shape, material, size);
                      }
                  }

                  Matcher f = FIND_TAG.matcher(reply);
                  if (f.find() && !done) {
                      done = true;
                      if (bot == null) player.sendMessage(Text.literal("<" + CONFIG.name + "> Spawn me first with /ai spawn"), false);
                      else bot.startFind(player, f.group(1).trim());
                  }

                  if (!done && COME_TAG.matcher(reply).find()) {
                      done = true;
                      if (bot != null) bot.stopJob("I'm coming!", player);
                  }

                  if (!done && STOP_TAG.matcher(reply).find()) {
                      done = true;
                      if (bot != null) bot.stopJob("Okay, I stopped.", player);
                  }

                  reply = BUILD_TAG.matcher(reply).replaceAll("");
                  reply = FIND_TAG.matcher(reply).replaceAll("");
                  reply = COME_TAG.matcher(reply).replaceAll("");
                  reply = STOP_TAG.matcher(reply).replaceAll("");
                  return reply.replaceAll("\\s{2,}", " ").trim();
              }

              private static AiBotEntity findNearestBot(ServerWorld world, ServerPlayerEntity player) {
                  AiBotEntity best = null;
                  double bestDist = Double.MAX_VALUE;

                  for (AiBotEntity bot : world.getEntitiesByType(AI_BOT, player.getBoundingBox().expand(200), b -> true)) {
                      double dist = bot.squaredDistanceTo(player);
                      if (dist < bestDist) {
                          bestDist = dist;
                          best = bot;
                      }
                  }
                  return best;
              }

              private static List<String> splitReply(String reply) {
                  List<String> parts = new ArrayList<>();
                  String text = reply.trim();

                  while (text.length() > 88) {
                      int cut = text.lastIndexOf(' ', 88);
                      if (cut < 20) cut = 88;
                      parts.add(text.substring(0, cut).trim());
                      text = text.substring(cut).trim();
                  }

                  if (!text.isBlank()) parts.add(text);
                  return parts;
              }
          }
          EOF

