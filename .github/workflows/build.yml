name: build aiplayer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Generate mod project
        run: |
          set -e
          mkdir -p src/main/java/com/example/aiplayer/client src/main/resources/assets/aiplayer/lang

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = "https://maven.fabricmc.net/" }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "aiplayer"
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven { url "https://maven.fabricmc.net/" }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.5
          mod_version=1.3.0
          maven_group=com.example
          archives_base_name=aiplayer
          fabric_version=0.102.0+1.21.1
          EOF

          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "aiplayer",
            "version": "${version}",
            "name": "AI Player",
            "description": "A player-like AI that follows you, talks, finds things and builds when you ask.",
            "authors": ["Prince"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.example.aiplayer.AiPlayerMod"],
              "client": ["com.example.aiplayer.client.AiPlayerClient"]
            },
            "depends": {
              "fabricloader": ">=0.16.5",
              "minecraft": "~1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/assets/aiplayer/lang/en_us.json << 'EOF'
          {
            "entity.aiplayer.ai_bot": "AI Player"
          }
          EOF

          cat > src/main/java/com/example/aiplayer/AiConfig.java << 'EOF'
          package com.example.aiplayer;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public class AiConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static final Path FILE = FabricLoader.getInstance().getConfigDir().resolve("aiplayer.json");
              private static final String DEFAULT_PERSONALITY = "You are an AI companion inside Minecraft Java 1.21.1. Talk like a helpful friendly gamer. Keep replies short and clear.";

              public String apiUrl = "https://api.groq.com/openai/v1/chat/completions";
              public String apiKey = "";
              public String model = "openai/gpt-oss-20b";
              public String name = "AI";
              public boolean talk = true;
              public String personality = DEFAULT_PERSONALITY;

              public static AiConfig load() {
                  try {
                      if (Files.exists(FILE)) {
                          try (Reader reader = Files.newBufferedReader(FILE)) {
                              AiConfig config = GSON.fromJson(reader, AiConfig.class);
                              if (config == null) config = new AiConfig();
                              config.fix();
                              return config;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  AiConfig config = new AiConfig();
                  config.save();
                  return config;
              }

              public void save() {
                  fix();
                  try {
                      Files.createDirectories(FILE.getParent());
                      try (Writer writer = Files.newBufferedWriter(FILE)) {
                          GSON.toJson(this, writer);
                      }
                  } catch (Exception ignored) {
                  }
              }

              public void fix() {
                  if (apiUrl == null || apiUrl.isBlank()) apiUrl = "https://api.groq.com/openai/v1/chat/completions";
                  if (model == null || model.isBlank()) model = "openai/gpt-oss-20b";
                  if (name == null || name.isBlank()) name = "AI";
                  if (apiKey == null) apiKey = "";
                  if (personality == null || personality.isBlank()) personality = DEFAULT_PERSONALITY;
              }

              public boolean hasKey() {
                  return apiKey != null && !apiKey.isBlank();
              }
          }
          EOF

          cat > src/main/java/com/example/aiplayer/Builds.java << 'EOF'
          package com.example.aiplayer;

          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.block.DoorBlock;
          import net.minecraft.block.LadderBlock;
          import net.minecraft.block.enums.DoubleBlockHalf;
          import net.minecraft.registry.Registries;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Direction;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;

          public class Builds {

              public static class BlockPlace {
                  public BlockPos pos;
                  public BlockState oldState;
                  public BlockState newState;

                  public BlockPlace(BlockPos pos, BlockState oldState, BlockState newState) {
                      this.pos = pos;
                      this.oldState = oldState;
                      this.newState = newState;
                  }
              }

              public static class Plan {
                  public List<BlockPlace> places = new ArrayList<>();
                  public String label = "";
                  public int size;
              }

              public static final List<BlockPlace> lastBuild = new ArrayList<>();

              public static BlockState pickBlock(String raw, BlockState fallback) {
                  if (raw == null || raw.isBlank()) return fallback;

                  String key = raw.trim().toLowerCase().replace(" ", "_");
                  Identifier id = Identifier.tryParse(key.contains(":") ? key : "minecraft:" + key);
                  if (id == null) return fallback;
                  if (!Registries.BLOCK.containsId(id)) return fallback;

                  Block block = Registries.BLOCK.get(id);
                  BlockState state = block.getDefaultState();

                  if (state.isAir()) return fallback;
                  if (state.hasBlockEntity()) return fallback;
                  if (!state.getFluidState().isEmpty()) return fallback;
                  if (block == Blocks.TNT || block == Blocks.BEDROCK || block == Blocks.BARRIER
                          || block == Blocks.FIRE || block == Blocks.LIGHT || block == Blocks.STRUCTURE_VOID) {
                      return fallback;
                  }
                  return state;
              }

              public static Plan make(String shapeRaw, String materialRaw, String sizeRaw, ServerWorld world, BlockPos start, Direction facing) {
                  String shape = shapeRaw == null ? "" : shapeRaw.trim().toLowerCase();
                  int size = parseSize(sizeRaw, shape);

                  BlockState wall = pickBlock(materialRaw, Blocks.OAK_PLANKS.getDefaultState());
                  BlockState glass = Blocks.GLASS_PANE.getDefaultState();
                  BlockState door = Blocks.OAK_DOOR.getDefaultState();
                  BlockState doorTop = door.with(DoorBlock.HALF, DoubleBlockHalf.UPPER);
                  BlockState torch = Blocks.TORCH.getDefaultState();
                  BlockState ladder = Blocks.LADDER.getDefaultState().with(LadderBlock.FACING, Direction.WEST);

                  Plan plan = new Plan();
                  plan.size = size;

                  if (shape.contains("tower")) {
                      plan.label = "tower " + size;
                      buildTower(plan, world, start, size, wall, torch, ladder);
                  } else if (shape.contains("wall") || shape.contains("fence")) {
                      plan.label = "wall " + size;
                      buildWall(plan, world, start, size, wall, facing);
                  } else if (shape.contains("bridge")) {
                      plan.label = "bridge " + size;
                      buildBridge(plan, world, start, size, wall, facing);
                  } else if (shape.contains("platform") || shape.contains("floor")) {
                      plan.label = "platform " + size + "x" + size;
                      buildPlatform(plan, world, start, size, wall);
                  } else if (shape.contains("pyramid")) {
                      plan.label = "pyramid " + size;
                      buildPyramid(plan, world, start, size, wall);
                  } else {
                      plan.label = "house " + size + "x" + size;
                      buildHouse(plan, world, start, size, wall, glass, door, doorTop, torch);
                  }

                  plan.places.sort(Comparator.comparingInt(p -> p.pos.getY()));
                  return plan;
              }

              private static int parseSize(String sizeRaw, String shape) {
                  int size = 9;
                  if (sizeRaw != null) {
                      String s = sizeRaw.replaceAll("[^0-9]", "");
                      if (!s.isBlank()) {
                          try {
                              size = Integer.parseInt(s);
                          } catch (Exception ignored) {
                          }
                      }
                  }

                  if (shape.contains("tower")) size = clamp(size, 5, 13);
                  else if (shape.contains("wall") || shape.contains("fence")) size = clamp(size, 6, 30);
                  else if (shape.contains("bridge")) size = clamp(size, 6, 40);
                  else if (shape.contains("platform") || shape.contains("floor")) size = clamp(size, 5, 21);
                  else if (shape.contains("pyramid")) size = clamp(size, 7, 17);
                  else size = clamp(size, 7, 15);

                  if (size % 2 == 0) size += 1;
                  return size;
              }

              private static void buildHouse(Plan plan, ServerWorld world, BlockPos start, int size, BlockState wall,
                                             BlockState glass, BlockState door, BlockState doorTop, BlockState torch) {
                  int half = size / 2;
                  int height = size <= 9 ? 4 : 5;

                  for (int x = -half; x <= half; x++) {
                      for (int z = -half; z <= half; z++) {
                          add(plan, world, start.add(x, 0, z), wall);
                      }
                  }

                  for (int y = 1; y <= height; y++) {
                      for (int x = -half; x <= half; x++) {
                          for (int z = -half; z <= half; z++) {
                              boolean border = x == -half || x == half || z == -half || z == half;
                              if (!border) continue;

                              BlockPos pos = start.add(x, y, z);

                              if (x == 0 && z == -half && y == 1) {
                                  add(plan, world, pos, door);
                                  add(plan, world, pos.up(), doorTop);
                                  continue;
                              }
                              if (x == 0 && z == -half && y == 2) continue;

                              boolean window = y == 2 && ((x == 0 && z == half) || (z == 0 && (x == -half || x == half)));
                              add(plan, world, pos, window ? glass : wall);
                          }
                      }
                  }

                  for (int x = -half - 1; x <= half + 1; x++) {
                      for (int z = -half - 1; z <= half + 1; z++) {
                          add(plan, world, start.add(x, height + 1, z), wall);
                      }
                  }

                  add(plan, world, start.add(half - 1, 1, half - 1), torch);
                  add(plan, world, start.add(-half + 1, 1, half - 1), torch);
                  add(plan, world, start.add(0, height + 2, 0), Blocks.LANTERN.getDefaultState());
              }

              private static void buildTower(Plan plan, ServerWorld world, BlockPos start, int size, BlockState wall,
                                             BlockState torch, BlockState ladder) {
                  int half = Math.max(2, size / 2);
                  int height = size + 6;

                  for (int x = -half; x <= half; x++) {
                      for (int z = -half; z <= half; z++) {
                          add(plan, world, start.add(x, 0, z), wall);
                      }
                  }

                  for (int y = 1; y <= height; y++) {
                      for (int x = -half; x <= half; x++) {
                          for (int z = -half; z <= half; z++) {
                              boolean border = x == -half || x == half || z == -half || z == half;
                              BlockPos pos = start.add(x, y, z);

                              if (!border) continue;

                              if (z == -half && x == 0 && (y == 1 || y == 2)) {
                                  add(plan, world, pos, Blocks.AIR.getDefaultState());
                                  continue;
                              }
                              if (z == half && x == 0 && y > 2 && y < height && y % 4 == 0) {
                                  add(plan, world, pos, Blocks.GLASS_PANE.getDefaultState());
                                  continue;
                              }
                              add(plan, world, pos, wall);
                          }
                      }
                      add(plan, world, start.add(half - 1, y, 0), ladder);
                  }

                  for (int x = -half - 1; x <= half + 1; x++) {
                      for (int z = -half - 1; z <= half + 1; z++) {
                          if (Math.max(Math.abs(x), Math.abs(z)) >= half) {
                              add(plan, world, start.add(x, height + 1, z), wall);
                          }
                      }
                  }

                  add(plan, world, start.add(0, 1, 0), torch);
                  add(plan, world, start.add(0, height + 2, 0), Blocks.LANTERN.getDefaultState());
              }

              private static void buildWall(Plan plan, ServerWorld world, BlockPos start, int length, BlockState wall, Direction facing) {
                  Direction side = facing.rotateYClockwise();
                  for (int i = 0; i < length; i++) {
                      BlockPos base = start.offset(facing, i);
                      for (int y = 1; y <= 5; y++) {
                          add(plan, world, base.up(y), wall);
                      }
                      if (i % 4 == 0) add(plan, world, base.offset(side, 1).up(1), wall);
                      if (i % 4 == 2) add(plan, world, base.offset(side, -1).up(1), wall);
                  }
              }

              private static void buildBridge(Plan plan, ServerWorld world, BlockPos start, int length, BlockState wall, Direction facing) {
                  Direction side = facing.rotateYClockwise();
                  for (int i = 0; i < length; i++) {
                      BlockPos center = start.offset(facing, i);
                      add(plan, world, center, wall);
                      add(plan, world, center.offset(side, 1), wall);
                      add(plan, world, center.offset(side, -1), wall);

                      if (i == 0 || i == length - 1 || i % 5 == 0) {
                          add(plan, world, center.offset(side, 1).up(1), wall);
                          add(plan, world, center.offset(side, -1).up(1), wall);
                          add(plan, world, center.offset(side, 1).up(2), Blocks.TORCH.getDefaultState());
                          add(plan, world, center.offset(side, -1).up(2), Blocks.TORCH.getDefaultState());
                      }
                  }
              }

              private static void buildPlatform(Plan plan, ServerWorld world, BlockPos start, int size, BlockState wall) {
                  int half = size / 2;
                  for (int x = -half; x <= half; x++) {
                      for (int z = -half; z <= half; z++) {
                          add(plan, world, start.add(x, 0, z), wall);
                          if (x == -half || x == half || z == -half || z == half) {
                              add(plan, world, start.add(x, 1, z), wall);
                              add(plan, world, start.add(x, 2, z), Blocks.TORCH.getDefaultState());
                          }
                      }
                  }
              }

              private static void buildPyramid(Plan plan, ServerWorld world, BlockPos start, int size, BlockState wall) {
                  int half = size / 2;
                  for (int layer = 0; layer <= half; layer++) {
                      int r = half - layer;
                      for (int x = -r; x <= r; x++) {
                          for (int z = -r; z <= r; z++) {
                              add(plan, world, start.add(x, layer, z), wall);
                          }
                      }
                  }
                  add(plan, world, start.up(half + 1), Blocks.LANTERN.getDefaultState());
              }

              private static void add(Plan plan, ServerWorld world, BlockPos pos, BlockState state) {
                  BlockPos p = pos.toImmutable();
                  for (int i = plan.places.size() - 1; i >= 0; i--) {
                      if (plan.places.get(i).pos.equals(p)) {
                          plan.places.remove(i);
                          break;
                      }
                  }
                  plan.places.add(new BlockPlace(p, world.getBlockState(p), state));
              }

              public static void undo(ServerWorld world) {
                  for (int i = lastBuild.size() - 1; i >= 0; i--) {
                      BlockPlace p = lastBuild.get(i);
                      if (p == null || p.pos == null || p.oldState == null) continue;
                      world.setBlockState(p.pos, p.oldState, 3);
                  }
                  lastBuild.clear();
              }

              private static int clamp(int v, int min, int max) {
                  return Math.max(min, Math.min(max, v));
              }
          }
          EOF

          cat > src/main/java/com/example/aiplayer/AiBotEntity.java << 'EOF'
          package com.example.aiplayer;

          import net.minecraft.block.Block;
          import net.minecraft.block.BlockState;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.ai.goal.SwimGoal;
          import net.minecraft.entity.attribute.DefaultAttributeContainer;
          import net.minecraft.entity.attribute.EntityAttributes;
          import net.minecraft.entity.damage.DamageSource;
          import net.minecraft.entity.mob.PathAwareEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.registry.Registries;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.text.Text;
          import net.minecraft.util.Hand;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.ChunkPos;
          import net.minecraft.util.math.Direction;
          import net.minecraft.world.Heightmap;
          import net.minecraft.world.World;
          import net.minecraft.world.chunk.Chunk;
          import net.minecraft.world.chunk.ChunkStatus;

          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class AiBotEntity extends PathAwareEntity {

              public enum Job { NONE, BUILD, FIND }

              public Job job = Job.NONE;

              public List<Builds.BlockPlace> buildPlaces = new ArrayList<>();
              public int buildIndex = 0;
              public int buildTicks = 0;
              public int buildWait = 0;
              public int buildCooldown = 0;
              public String buildLabel = "";

              public String findTarget = "";
              public Set<Block> findBlocks = new HashSet<>();
              public BlockPos findPos = null;
              public int findTicks = 0;
              public int findWalkTicks = 0;
              public int findScanChunk = 0;
              private ChunkPos lastScanChunk = null;

              public AiBotEntity(EntityType<? extends PathAwareEntity> entityType, World world) {
                  super(entityType, world);
                  this.setPersistent();
                  this.setCustomNameVisible(true);
                  this.setInvulnerable(true);
              }

              public static DefaultAttributeContainer.Builder createAttributes() {
                  return PathAwareEntity.createMobAttributes()
                          .add(EntityAttributes.GENERIC_MAX_HEALTH, 20.0D)
                          .add(EntityAttributes.GENERIC_MOVEMENT_SPEED, 0.31D)
                          .add(EntityAttributes.GENERIC_FOLLOW_RANGE, 64.0D)
                          .add(EntityAttributes.GENERIC_STEP_HEIGHT, 1.1D);
              }

              @Override
              protected void initGoals() {
                  this.goalSelector.add(0, new SwimGoal(this));
              }

              private void goTo(double x, double y, double z, double speed) {
                  if (!this.getNavigation().startMovingTo(x, y, z, speed)) {
                      this.getMoveControl().moveTo(x, y, z, speed);
                  }
              }

              @Override
              public void tick() {
                  super.tick();

                  if (!(this.getWorld() instanceof ServerWorld world)) return;

                  PlayerEntity nearest = world.getClosestPlayer(this, 256.0D);
                  if (!(nearest instanceof ServerPlayerEntity owner)) return;

                  if (this.age % 20 == 0) {
                      if (this.getCustomName() == null || !this.getCustomName().getString().equals(AiPlayerMod.CONFIG.name)) {
                          this.setCustomName(Text.literal(AiPlayerMod.CONFIG.name));
                      }
                  }

                  if (job == Job.BUILD) {
                      tickBuild(world, owner);
                      return;
                  }
                  if (job == Job.FIND) {
                      tickFind(world, owner);
                      return;
                  }

                  double d = this.squaredDistanceTo(owner);
                  if (d > 32.0D * 32.0D) {
                      if (this.age % 20 == 0) {
                          this.refreshPositionAndAngles(owner.getX() + 1.3D, owner.getY(), owner.getZ() + 1.3D, this.getYaw(), this.getPitch());
                          this.getNavigation().stop();
                      }
                  } else if (d > 3.8D * 3.8D) {
                      if (this.getNavigation().isIdle() || this.age % 10 == 0) {
                          goTo(owner.getX(), owner.getY(), owner.getZ(), 1.2D);
                      }
                  } else {
                      if (!this.getNavigation().isIdle()) this.getNavigation().stop();
                      this.getLookControl().lookAt(owner.getX(), owner.getEyeY(), owner.getZ());
                  }
              }

              public void stopJob(String msg, ServerPlayerEntity player) {
                  if (job == Job.BUILD && buildIndex > 0 && buildIndex < buildPlaces.size()) {
                      Builds.lastBuild.clear();
                      Builds.lastBuild.addAll(buildPlaces.subList(0, buildIndex));
                  }

                  job = Job.NONE;
                  buildPlaces = new ArrayList<>();
                  buildIndex = 0;
                  buildTicks = 0;
                  buildWait = 0;
                  buildCooldown = 0;
                  buildLabel = "";
                  findTarget = "";
                  findBlocks = new HashSet<>();
                  findPos = null;
                  findTicks = 0;
                  findWalkTicks = 0;
                  findScanChunk = 0;
                  lastScanChunk = null;
                  this.getNavigation().stop();

                  if (player != null && msg != null && !msg.isBlank()) {
                      player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> " + msg), false);
                  }
              }

              // ---------------- BUILD ----------------

              public void startBuild(ServerPlayerEntity player, String shape, String material, String size) {
                  if (!(player.getWorld() instanceof ServerWorld world)) return;

                  stopJob(null, null);

                  Direction facing = player.getHorizontalFacing();
                  BlockPos start = player.getBlockPos().offset(facing, 8).down();

                  Builds.Plan plan = Builds.make(shape, material, size, world, start, facing);

                  if (plan.places.isEmpty()) {
                      player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> I could not make that build."), false);
                      return;
                  }
                  if (plan.places.size() > 2200) {
                      player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> That is too big. Try a smaller size."), false);
                      return;
                  }

                  buildPlaces = new ArrayList<>(plan.places);
                  buildIndex = 0;
                  buildTicks = 0;
                  buildWait = 0;
                  buildCooldown = 0;
                  buildLabel = plan.label;
                  job = Job.BUILD;

                  player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Okay! I will build the " + buildLabel + " myself. (" + buildPlaces.size() + " blocks)"), false);
              }

              private void tickBuild(ServerWorld world, ServerPlayerEntity owner) {
                  if (buildIndex >= buildPlaces.size()) {
                      Builds.lastBuild.clear();
                      Builds.lastBuild.addAll(buildPlaces);
                      String label = buildLabel;
                      stopJob(null, null);
                      owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Done! I finished the " + label + ". (/ai undo removes it)"), false);
                      return;
                  }

                  buildTicks++;

                  Builds.BlockPlace p = buildPlaces.get(buildIndex);
                  BlockPos t = p.pos;

                  double dx = this.getX() - (t.getX() + 0.5D);
                  double dz = this.getZ() - (t.getZ() + 0.5D);
                  double hd = dx * dx + dz * dz;
                  double dy = Math.abs(this.getY() - t.getY());
                  boolean inReach = hd <= 20.0D && dy <= 4.5D;

                  if (!inReach && buildWait < 80) {
                      buildWait++;
                      if (this.getNavigation().isIdle() || buildWait % 20 == 1) {
                          goTo(t.getX() + 0.5D, this.getY(), t.getZ() + 0.5D, 1.3D);
                      }
                      return;
                  }

                  if (!this.getNavigation().isIdle()) this.getNavigation().stop();
                  this.getLookControl().lookAt(t.getX() + 0.5D, t.getY() + 0.5D, t.getZ() + 0.5D);

                  if (buildCooldown > 0) {
                      buildCooldown--;
                      return;
                  }

                  BlockState state = p.newState;
                  world.setBlockState(t, state, 3);
                  this.swingHand(Hand.MAIN_HAND);
                  world.playSound(null, t, state.getSoundGroup().getPlaceSound(), SoundCategory.BLOCKS, 0.8F, 0.9F + world.random.nextFloat() * 0.2F);
                  world.spawnParticles(ParticleTypes.CLOUD, t.getX() + 0.5D, t.getY() + 0.8D, t.getZ() + 0.5D, 2, 0.15D, 0.1D, 0.15D, 0.01D);

                  buildIndex++;
                  buildWait = 0;
                  buildCooldown = 4;

                  if (buildIndex % 10 == 0) {
                      owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Building... " + buildIndex + "/" + buildPlaces.size()), true);
                  }
              }

              // ---------------- FIND ----------------

              public static Set<Block> blocksFor(String raw) {
                  String t = raw.toLowerCase().replace("minecraft:", "").trim().replace(' ', '_');
                  Set<Block> set = rules(t);
                  if (set.isEmpty() && t.endsWith("s") && !t.endsWith("ss") && t.length() > 3) {
                      set = rules(t.substring(0, t.length() - 1));
                  }
                  return set;
              }

              private static Set<Block> rules(String t) {
                  Set<Block> set = new HashSet<>();
                  boolean isOre = List.of("diamond", "iron", "gold", "emerald", "coal", "copper", "lapis", "redstone", "quartz", "ore").contains(t)
                          || t.endsWith("_ore");
                  boolean debris = t.contains("debris") || t.contains("netherite") || t.contains("ancient");
                  boolean tree = t.equals("tree") || t.equals("trees") || t.equals("wood") || t.equals("log") || t.equals("logs");
                  boolean apple = t.contains("apple");

                  for (Block b : Registries.BLOCK) {
                      String p = Registries.BLOCK.getId(b).getPath();
                      if (debris) {
                          if (p.equals("ancient_debris")) set.add(b);
                      } else if (isOre) {
                          String name = t.replace("_ore", "");
                          if (p.endsWith("_ore") && (name.equals("ore") || name.isEmpty() || p.contains(name))) set.add(b);
                      } else if (tree) {
                          if (p.endsWith("_log")) set.add(b);
                      } else if (apple) {
                          if (p.equals("oak_leaves") || p.equals("dark_oak_leaves")) set.add(b);
                      } else if (p.equals(t)) {
                          set.add(b);
                      }
                  }

                  if (set.isEmpty() && !isOre && !debris && !tree && !apple && t.length() >= 4) {
                      for (Block b : Registries.BLOCK) {
                          String p = Registries.BLOCK.getId(b).getPath();
                          if (p.contains(t)) set.add(b);
                      }
                  }
                  return set;
              }

              public void startFind(ServerPlayerEntity player, String targetRaw) {
                  stopJob(null, null);

                  String target = targetRaw == null ? "" : targetRaw.trim();
                  if (target.isBlank()) {
                      player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Tell me what to find."), false);
                      return;
                  }

                  Set<Block> blocks = blocksFor(target);
                  if (blocks.isEmpty()) {
                      player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> I don't know a block called \"" + target + "\"."), false);
                      return;
                  }

                  findTarget = target;
                  findBlocks = blocks;
                  findPos = null;
                  findTicks = 0;
                  findWalkTicks = 0;
                  findScanChunk = 0;
                  lastScanChunk = null;
                  job = Job.FIND;

                  player.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Okay, I am searching for " + findTarget + ". I will walk around to look."), false);
              }

              private void tickFind(ServerWorld world, ServerPlayerEntity owner) {
                  findTicks++;

                  if (findTicks > 3000) {
                      String t = findTarget;
                      stopJob(null, null);
                      owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> I could not find " + t + " in the loaded area. Try moving somewhere else and ask again."), false);
                      return;
                  }

                  if (findPos != null) {
                      walkToFound(world, owner);
                      return;
                  }

                  if (findTicks % 100 == 1 || (this.getNavigation().isIdle() && findTicks % 20 == 0)) {
                      double a = this.random.nextDouble() * Math.PI * 2.0D;
                      goTo(this.getX() + Math.cos(a) * 25.0D, this.getY(), this.getZ() + Math.sin(a) * 25.0D, 1.15D);
                  }

                  if (findTicks % 40 == 0) {
                      owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Searching for " + findTarget + "..."), true);
                  }

                  if (findTicks % 5 == 0) {
                      BlockPos found = scan(world);
                      if (found != null) {
                          findPos = found.toImmutable();
                          findWalkTicks = 0;
                          int dist = (int) Math.sqrt(owner.squaredDistanceTo(found.getX() + 0.5D, found.getY() + 0.5D, found.getZ() + 0.5D));
                          owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> Found " + findTarget + " at X=" + found.getX() + " Y=" + found.getY() + " Z=" + found.getZ()
                                  + " (" + dist + " blocks from you). I am going there!"), false);
                      }
                  }
              }

              private void walkToFound(ServerWorld world, ServerPlayerEntity owner) {
                  findWalkTicks++;

                  int surface = world.getTopY(Heightmap.Type.MOTION_BLOCKING, findPos.getX(), findPos.getZ());
                  double goalY = findPos.getY() >= surface - 2 ? findPos.getY() : surface;

                  if (this.getNavigation().isIdle() || findWalkTicks % 20 == 0) {
                      goTo(findPos.getX() + 0.5D, goalY, findPos.getZ() + 0.5D, 1.3D);
                  }
                  this.getLookControl().lookAt(findPos.getX() + 0.5D, findPos.getY() + 0.5D, findPos.getZ() + 0.5D);

                  if (findWalkTicks % 15 == 0) {
                      world.spawnParticles(ParticleTypes.HAPPY_VILLAGER, findPos.getX() + 0.5D, findPos.getY() + 1.0D, findPos.getZ() + 0.5D, 8, 0.4D, 0.5D, 0.4D, 0.02D);
                  }

                  double dx = this.getX() - (findPos.getX() + 0.5D);
                  double dz = this.getZ() - (findPos.getZ() + 0.5D);

                  if (dx * dx + dz * dz < 3.5D * 3.5D || findWalkTicks > 900) {
                      int dy = findPos.getY() - this.getBlockY();
                      String where = "";
                      if (dy < -3) where = " It is " + (-dy) + " blocks below me, you need to dig down.";
                      else if (dy > 3) where = " It is " + dy + " blocks above me.";

                      owner.sendMessage(Text.literal("<" + AiPlayerMod.CONFIG.name + "> I'm here! " + findTarget + " is at X=" + findPos.getX() + " Y=" + findPos.getY() + " Z=" + findPos.getZ() + "." + where), false);
                      world.spawnParticles(ParticleTypes.HAPPY_VILLAGER, findPos.getX() + 0.5D, findPos.getY() + 1.1D, findPos.getZ() + 0.5D, 40, 0.7D, 0.9D, 0.7D, 0.03D);
                      world.playSound(null, findPos, SoundEvents.ENTITY_PLAYER_LEVELUP, SoundCategory.PLAYERS, 0.5F, 1.6F);
                      stopJob(null, null);
                  }
              }

              private BlockPos scan(ServerWorld world) {
                  ChunkPos center = this.getChunkPos();
                  if (lastScanChunk == null || !lastScanChunk.equals(center)) {
                      lastScanChunk = center;
                      findScanChunk = 0;
                  }

                  int radius = 7;
                  List<ChunkPos> chunks = new ArrayList<>();
                  for (int dx = -radius; dx <= radius; dx++) {
                      for (int dz = -radius; dz <= radius; dz++) {
                          chunks.add(new ChunkPos(center.x + dx, center.z + dz));
                      }
                  }
                  chunks.sort((a, b) -> {
                      int da = (a.x - center.x) * (a.x - center.x) + (a.z - center.z) * (a.z - center.z);
                      int db = (b.x - center.x) * (b.x - center.x) + (b.z - center.z) * (b.z - center.z);
                      return Integer.compare(da, db);
                  });

                  int minY = world.getBottomY();
                  int maxY = Math.min(world.getTopY() - 1, 200);

                  for (int i = 0; i < 2; i++) {
                      if (findScanChunk >= chunks.size()) {
                          findScanChunk = 0;
                          return null;
                      }

                      ChunkPos cp = chunks.get(findScanChunk);
                      findScanChunk++;

                      Chunk chunk = world.getChunk(cp.x, cp.z, ChunkStatus.FULL, false);
                      if (chunk == null) continue;

                      BlockPos best = null;
                      double bestDist = Double.MAX_VALUE;
                      BlockPos.Mutable m = new BlockPos.Mutable();

                      for (int x = cp.getStartX(); x <= cp.getEndX(); x++) {
                          for (int z = cp.getStartZ(); z <= cp.getEndZ(); z++) {
                              for (int y = minY; y <= maxY; y++) {
                                  m.set(x, y, z);
                                  if (!findBlocks.contains(chunk.getBlockState(m).getBlock())) continue;
                                  double d = this.squaredDistanceTo(x + 0.5D, y + 0.5D, z + 0.5D);
                                  if (d < bestDist) {
                                      bestDist = d;
                                      best = m.toImmutable();
                                  }
                              }
                          }
                      }

                      if (best != null) return best;
                  }
                  return null;
              }

              // ---------------- misc ----------------

              @Override
              public boolean damage(DamageSource source, float amount) {
                  return false;
              }

              @Override
              public boolean canImmediatelyDespawn(double distanceSquared) {
                  return false;
              }

              @Override
              public void writeCustomDataToNbt(NbtCompound nbt) {
                  super.writeCustomDataToNbt(nbt);
                  nbt.putString("BotName", AiPlayerMod.CONFIG.name);
              }

              @Override
              public void readCustomDataFromNbt(NbtCompound nbt) {
                  super.readCustomDataFromNbt(nbt);
                  if (nbt.contains("BotName")) {
                      this.setCustomName(Text.literal(nbt.getString("BotName")));
                  }
              }
          }
